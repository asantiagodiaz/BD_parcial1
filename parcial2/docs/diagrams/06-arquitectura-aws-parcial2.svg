<text x="1231" y="319" font-size="14" font-weight="600" text-anchor="end" fill="#5f3dc4">Ruta analítica (limpieza por lotes + consultas del panel)</text>
<line x1="165" y1="110.0" x2="330" y2="128.0" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="182.0" y="98.0" width="131.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="247.5" y="112.0" font-size="12" text-anchor="middle" fill="#212529">buscar / reservar</text>
<line x1="165" y1="215.0" x2="330" y2="172.0" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="192.5" y="198.5" width="110.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="247.5" y="212.5" font-size="12" text-anchor="middle" fill="#212529">panel /manager</text>
<line x1="565" y1="150.0" x2="690" y2="150.0" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="572.5" y="129.0" width="110.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="627.5" y="143.0" font-size="12" text-anchor="middle" fill="#212529">UPDATE atómico</text>
<line x1="447.5" y1="205" x2="430.0" y2="355" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="359.25" y="287.0" width="159.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="438.75" y="301.0" font-size="12" text-anchor="middle" fill="#212529">consulta SQL a Athena</text>
<line x1="430.0" y1="445" x2="430.0" y2="545" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="343.5" y="484.0" width="173.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="430.0" y="498.0" font-size="12" text-anchor="middle" fill="#212529">esquema de las 2 tablas</text>
<line x1="530" y1="400.0" x2="630" y2="400.0" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="542.5" y="381.0" width="75.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="580.0" y="395.0" font-size="12" text-anchor="middle" fill="#212529">lee 1 mes</text>
<line x1="740.0" y1="545" x2="740.0" y2="445" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="681.5" y="484.0" width="117.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="740.0" y="498.0" font-size="12" text-anchor="middle" fill="#212529">escribe Parquet</text>
<line x1="940" y1="590.0" x2="850" y2="590.0" stroke="#343a40" stroke-width="2" marker-end="url(#f)"/>
<rect x="864.5" y="571.0" width="61.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="895.0" y="585.0" font-size="12" text-anchor="middle" fill="#212529">lee CSV</text>
<rect x="15" y="75" width="150" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="90.0" y="105.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Cliente</text>
<text x="90.0" y="123.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">buscar y reservar</text>
<rect x="15" y="180" width="150" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="90.0" y="210.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Gerente</text>
<text x="90.0" y="228.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">panel de ocupación</text>
<rect x="330" y="95" width="235" height="110" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
<text x="447.5" y="136.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">EC2 t3.small</text>
<text x="447.5" y="154.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">API FastAPI + frontend React</text>
<text x="447.5" y="172.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">(compilado · un proceso · :8000)</text>
<rect x="690" y="95" width="190" height="110" rx="10" fill="#d0ebff" stroke="#1864ab" stroke-width="2"/>
<text x="785.0" y="136.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">RDS PostgreSQL</text>
<text x="785.0" y="154.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">db.t3.micro · 1 AZ</text>
<text x="785.0" y="172.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">privada (solo la EC2)</text>
<rect x="330" y="355" width="200" height="90" rx="10" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/>
<text x="430.0" y="386.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Athena</text>
<text x="430.0" y="404.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">workgroup airline-wg</text>
<text x="430.0" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">tope 1 GB por consulta</text>
<rect x="330" y="545" width="200" height="90" rx="10" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/>
<text x="430.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Glue Data Catalog</text>
<text x="430.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">2 tablas · partition</text>
<text x="430.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">projection (sin crawlers)</text>
<rect x="630" y="355" width="220" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="740.0" y="386.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">S3 curated/</text>
<text x="740.0" y="404.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">Parquet por month=YYYY-MM</text>
<text x="740.0" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">24 particiones</text>
<rect x="630" y="545" width="220" height="90" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
<text x="740.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">EMR · 1 × m4.large</text>
<text x="740.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">PySpark: reglas C1–C5</text>
<text x="740.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">efímero (--auto-terminate)</text>
<rect x="940" y="545" width="200" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1040.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">S3 raw/</text>
<text x="1040.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">CSV crudo y sucio</text>
<text x="1040.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">2,0 M de reservas</text>
<rect x="900" y="345" width="330" height="130" rx="10" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="914" y="387.0" font-size="14" font-weight="700" text-anchor="start" fill="#212529">Datos del equipo (semilla 963)</text>
<text x="914" y="405.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">9 rutas · 150 asientos por vuelo · K = 8</text>
<text x="914" y="423.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">24 meses (2023-01 a 2024-12)</text>
<text x="914" y="441.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">Costo proyectado ≈ US$ 31,9 / mes</text>
<rect x="910" y="90" width="320" height="120" rx="10" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="924" y="127.0" font-size="14" font-weight="700" text-anchor="start" fill="#212529">R2: sin sobreventa</text>
<text x="924" y="145.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">UPDATE ... WHERE seats_sold &lt; capacity</text>
<text x="924" y="163.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">afecta 1 fila → 201; 0 filas → 409</text>
<text x="924" y="181.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">probado con 50 clientes simultáneos</text>
<circle cx="15" cy="75" r="12" fill="#212529"/>
<text x="15" y="79.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="15" cy="180" r="12" fill="#212529"/>
<text x="15" y="184.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="330" cy="95" r="12" fill="#212529"/>
<text x="330" y="99.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="690" cy="95" r="12" fill="#212529"/>
<text x="690" y="99.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="330" cy="355" r="12" fill="#212529"/>
<text x="330" y="359.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="330" cy="545" r="12" fill="#212529"/>
<text x="330" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<circle cx="630" cy="355" r="12" fill="#212529"/>
<text x="630" y="359.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<circle cx="630" cy="545" r="12" fill="#212529"/>
<text x="630" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<circle cx="940" cy="545" r="12" fill="#212529"/>
<text x="940" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
<rect x="15" y="725" width="1250" height="305" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
<text x="35" y="753" font-size="15" font-weight="700" fill="#212529">¿Qué es cada cosa?  <tspan font-weight="400" font-size="12" fill="#495057">(los números marcan cada elemento del diagrama; las flechas indican quién le pide datos a quién)</tspan></text>
<circle cx="45" cy="783" r="10" fill="#212529"/>
<text x="45" y="787" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="63" y="787" font-size="13" font-weight="700" fill="#212529">Cliente</text>
<text x="63" y="802" font-size="11.5" fill="#343a40">Persona que busca un vuelo y lo reserva desde el navegador.</text>
<text x="63" y="816" font-size="11.5" fill="#343a40">Es la página principal (/) del frontend.</text>
<circle cx="45" cy="830" r="10" fill="#212529"/>
<text x="45" y="834" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="63" y="834" font-size="13" font-weight="700" fill="#212529">Gerente</text>
<text x="63" y="849" font-size="11.5" fill="#343a40">Persona de la aerolínea que consulta la ocupación por ruta y mes en el</text>
<text x="63" y="863" font-size="11.5" fill="#343a40">panel (/manager): ve el porcentaje y el ranking de las 9 rutas.</text>
<circle cx="45" cy="877" r="10" fill="#212529"/>
<text x="45" y="881" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="63" y="881" font-size="13" font-weight="700" fill="#212529">EC2 t3.small</text>
<text x="63" y="896" font-size="11.5" fill="#343a40">Máquina virtual que ejecuta la API (FastAPI) y entrega el frontend React</text>
<text x="63" y="910" font-size="11.5" fill="#343a40">ya compilado. Es un solo proceso en el puerto 8000; no necesita Node.</text>
<circle cx="45" cy="924" r="10" fill="#212529"/>
<text x="45" y="928" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="63" y="928" font-size="13" font-weight="700" fill="#212529">RDS PostgreSQL</text>
<text x="63" y="943" font-size="11.5" fill="#343a40">Base de datos de vuelos y reservas. Es privada: solo la EC2 se conecta.</text>
<text x="63" y="957" font-size="11.5" fill="#343a40">Un UPDATE condicional impide vender un asiento de más.</text>
<circle cx="45" cy="971" r="10" fill="#212529"/>
<text x="45" y="975" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="63" y="975" font-size="13" font-weight="700" fill="#212529">Athena</text>
<text x="63" y="990" font-size="11.5" fill="#343a40">Ejecuta SQL directamente sobre los archivos de S3, sin servidor propio.</text>
<text x="63" y="1004" font-size="11.5" fill="#343a40">El panel le pregunta la ocupación; cobra solo por los datos que lee.</text>
<circle cx="665" cy="783" r="10" fill="#212529"/>
<text x="665" y="787" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="683" y="787" font-size="13" font-weight="700" fill="#212529">Glue Data Catalog</text>
<text x="683" y="802" font-size="11.5" fill="#343a40">Guarda cómo son las 2 tablas (columnas y carpeta de S3) para que Athena</text>
<text x="683" y="816" font-size="11.5" fill="#343a40">las entienda. Con partition projection conoce los 24 meses sin crawlers.</text>
<circle cx="665" cy="830" r="10" fill="#212529"/>
<text x="665" y="834" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<text x="683" y="834" font-size="13" font-weight="700" fill="#212529">S3 curated/</text>
<text x="683" y="849" font-size="11.5" fill="#343a40">Datos ya limpios en Parquet, una carpeta por mes (month=2024-01...).</text>
<text x="683" y="863" font-size="11.5" fill="#343a40">Una consulta de un mes solo lee su carpeta: por eso escanea tan poco.</text>
<circle cx="665" cy="877" r="10" fill="#212529"/>
<text x="665" y="881" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<text x="683" y="881" font-size="13" font-weight="700" fill="#212529">EMR (Spark)</text>
<text x="683" y="896" font-size="11.5" fill="#343a40">Cluster temporal que lee los CSV, aplica las reglas de limpieza C1–C5 y</text>
<text x="683" y="910" font-size="11.5" fill="#343a40">escribe el Parquet. Se apaga solo al terminar, para no seguir cobrando.</text>
<circle cx="665" cy="924" r="10" fill="#212529"/>
<text x="665" y="928" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
<text x="683" y="928" font-size="13" font-weight="700" fill="#212529">S3 raw/</text>
<text x="683" y="943" font-size="11.5" fill="#343a40">El historial tal como llega: 2 millones de reservas en CSV, con rutas mal</text>
<text x="683" y="957" font-size="11.5" fill="#343a40">escritas, estados raros, filas repetidas y precios inválidos.</text>
</svg>
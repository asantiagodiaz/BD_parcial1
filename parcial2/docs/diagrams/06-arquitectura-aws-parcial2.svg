<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1045" width="1280" height="1045" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs>
<rect width="1280" height="1045" fill="#ffffff"/>
<rect x="250" y="15" width="1015" height="690" rx="10" fill="none" stroke="#232f3e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1251" y="39" font-size="14" font-weight="600" text-anchor="end" fill="#232f3e">AWS Academy Learner Lab · us-east-1 · VPC por defecto · una sola AZ</text>
<rect x="270" y="50" width="975" height="225" rx="10" fill="none" stroke="#1864ab" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1231" y="74" font-size="14" font-weight="600" text-anchor="end" fill="#1864ab">Ruta transaccional (reservas) · nunca se mezcla con la analítica</text>

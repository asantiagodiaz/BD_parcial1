<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel gerencial</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Panel gerencial</h1>
    <nav><a href="/">Reservar</a> · <a href="/manager/">Panel gerencial</a></nav>
  </header>

  <main>
    <section class="card">
      <h2>Ocupación por ruta y mes</h2>
      <div class="row">
        <label>Ruta <input data-testid="manager-route" id="manager-route" placeholder="BOG-MDE"></label>
        <label>Mes <input data-testid="manager-month" id="manager-month" placeholder="2024-03" maxlength="7"></label>
        <button data-testid="manager-load" id="manager-load">Consultar</button>
      </div>
      <p id="manager-msg" class="msg" role="status"></p>
      <div id="result" hidden>
        <p class="big" data-testid="occupancy-value" id="occupancy-value"></p>
        <p id="occupancy-detail" class="muted"></p>
      </div>
    </section>
  </main>

  <script src="/static/manager.js"></script>
</body>
</html>

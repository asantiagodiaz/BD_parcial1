<text x="635.0" y="583.0" font-size="12" text-anchor="middle" fill="#212529">registra tablas</text>
<rect x="15" y="75" width="185" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="107.5" y="105.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Cliente</text>
<text x="107.5" y="123.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">buscar · reservar · cancelar</text>
<rect x="15" y="180" width="185" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="107.5" y="210.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Gerente</text>
<text x="107.5" y="228.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">panel en vivo</text>
<rect x="300" y="90" width="250" height="130" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
<text x="425.0" y="132.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">EC2 t3.small</text>
<text x="425.0" y="150.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">FastAPI + React + PostgreSQL 16</text>
<text x="425.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">hilo consumidor (vista en vivo)</text>
<text x="425.0" y="186.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">job refresh-star</text>
<rect x="720" y="95" width="200" height="120" rx="10" fill="#ffdeeb" stroke="#c2255c" stroke-width="2"/>
<text x="820.0" y="132.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Kinesis Data Stream</text>
<text x="820.0" y="150.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">provisionado · 1 shard · 24 h</text>
<text x="820.0" y="168.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">sin enhanced fan-out</text>
<text x="820.0" y="186.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">solo mientras se prueba</text>
<rect x="720" y="355" width="200" height="90" rx="10" fill="#ffdeeb" stroke="#c2255c" stroke-width="2"/>
<text x="820.0" y="386.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Kinesis Data Firehose</text>
<text x="820.0" y="404.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">búfer 60 s · gzip</text>
<text x="820.0" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">un evento por línea</text>
<rect x="1000" y="355" width="220" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1110.0" y="386.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">S3 raw/events/</text>
<text x="1110.0" y="404.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">landing zone (append-only)</text>
<text x="1110.0" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">JSON por línea, con duplicados</text>
<rect x="720" y="545" width="200" height="90" rx="10" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/>
<text x="820.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Athena</text>
<text x="820.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">workgroup airline-p3</text>
<text x="820.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">CTAS · tope 1 GB por consulta</text>
<rect x="300" y="545" width="250" height="90" rx="10" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/>
<text x="425.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">Glue Data Catalog</text>
<text x="425.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">base airline_star</text>
<text x="425.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">3 dimensiones + 2 hechos</text>
<rect x="1000" y="545" width="220" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1110.0" y="576.0" font-size="14" font-weight="700" text-anchor="middle" fill="#212529">S3 star/</text>
<text x="1110.0" y="594.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">Parquet · hechos por month</text>
<text x="1110.0" y="612.0" font-size="12" font-weight="400" text-anchor="middle" fill="#212529">reconstruido cada 10 min</text>
<rect x="285" y="345" width="285" height="130" rx="10" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="299" y="387.0" font-size="14" font-weight="700" text-anchor="start" fill="#212529">Datos del equipo (semilla 963)</text>
<text x="299" y="405.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">9 rutas · 3 cambian de categoría</text>
<text x="299" y="423.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">replay: 20.509 → 19.912 eventos</text>
<text x="299" y="441.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">Costo proyectado ≈ US$ 18,2 / mes</text>
<rect x="960" y="85" width="280" height="140" rx="10" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<text x="974" y="123.0" font-size="14" font-weight="700" text-anchor="start" fill="#212529">Publicar sin frenar la API (R2)</text>
<text x="974" y="141.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">búsquedas: cola + PutRecords por lote</text>
<text x="974" y="159.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">reservas: PutRecord tras el commit</text>
<text x="974" y="177.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">p95 = 0,335 s con 50 clientes</text>
<text x="974" y="195.0" font-size="12" font-weight="400" text-anchor="start" fill="#212529">200 / 200 eventos en el stream</text>
<circle cx="15" cy="75" r="12" fill="#212529"/>
<text x="15" y="79.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="15" cy="180" r="12" fill="#212529"/>
<text x="15" y="184.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="300" cy="90" r="12" fill="#212529"/>
<text x="300" y="94.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="720" cy="95" r="12" fill="#212529"/>
<text x="720" y="99.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="720" cy="355" r="12" fill="#212529"/>
<text x="720" y="359.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="1000" cy="355" r="12" fill="#212529"/>
<text x="1000" y="359.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<circle cx="720" cy="545" r="12" fill="#212529"/>
<text x="720" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<circle cx="300" cy="545" r="12" fill="#212529"/>
<text x="300" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<circle cx="1000" cy="545" r="12" fill="#212529"/>
<text x="1000" y="549.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
<rect x="15" y="725" width="1250" height="305" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
<text x="35" y="753" font-size="15" font-weight="700" fill="#212529">¿Qué es cada cosa?  <tspan font-weight="400" font-size="12" fill="#495057">(los números marcan cada elemento del diagrama; las flechas indican hacia dónde viajan los datos)</tspan></text>
<circle cx="45" cy="783" r="10" fill="#212529"/>
<text x="45" y="787" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="63" y="787" font-size="13" font-weight="700" fill="#212529">Cliente</text>
<text x="63" y="802" font-size="11.5" fill="#343a40">Persona que busca, reserva o cancela desde el navegador (página /).</text>
<text x="63" y="816" font-size="11.5" fill="#343a40">Cada acción produce exactamente un evento.</text>
<circle cx="45" cy="830" r="10" fill="#212529"/>
<text x="45" y="834" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="63" y="834" font-size="13" font-weight="700" fill="#212529">Gerente</text>
<text x="63" y="849" font-size="11.5" fill="#343a40">Ve en /manager las búsquedas, reservas y conversión de los últimos</text>
<text x="63" y="863" font-size="11.5" fill="#343a40">minutos, y puede pedir que se reconstruya el modelo estrella.</text>
<circle cx="45" cy="877" r="10" fill="#212529"/>
<text x="45" y="881" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="63" y="881" font-size="13" font-weight="700" fill="#212529">EC2 t3.small</text>
<text x="63" y="896" font-size="11.5" fill="#343a40">Una sola máquina: API, frontend, PostgreSQL y un hilo que lee el stream</text>
<text x="63" y="910" font-size="11.5" fill="#343a40">y cuenta eventos por la hora en que ocurrieron (vista en vivo).</text>
<circle cx="45" cy="924" r="10" fill="#212529"/>
<text x="45" y="928" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="63" y="928" font-size="13" font-weight="700" fill="#212529">Kinesis Data Stream</text>
<text x="63" y="943" font-size="11.5" fill="#343a40">Cola de eventos con 1 shard. Se crea con un script al empezar a probar</text>
<text x="63" y="957" font-size="11.5" fill="#343a40">y se borra al terminar, porque se cobra por cada hora que existe.</text>
<circle cx="45" cy="971" r="10" fill="#212529"/>
<text x="45" y="975" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="63" y="975" font-size="13" font-weight="700" fill="#212529">Kinesis Data Firehose</text>
<text x="63" y="990" font-size="11.5" fill="#343a40">Servicio gestionado que lee el stream y cada 60 s escribe un archivo</text>
<text x="63" y="1004" font-size="11.5" fill="#343a40">comprimido en S3, con un evento por línea.</text>
<circle cx="665" cy="783" r="10" fill="#212529"/>
<text x="665" y="787" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="683" y="787" font-size="13" font-weight="700" fill="#212529">S3 raw/events/</text>
<text x="683" y="802" font-size="11.5" fill="#343a40">La landing zone: todos los eventos tal como llegaron, incluidos</text>
<text x="683" y="816" font-size="11.5" fill="#343a40">duplicados, tardíos y desordenados. Nunca se modifica.</text>
<circle cx="665" cy="830" r="10" fill="#212529"/>
<text x="665" y="834" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<text x="683" y="834" font-size="13" font-weight="700" fill="#212529">Athena</text>
<text x="683" y="849" font-size="11.5" fill="#343a40">Ejecuta SQL sobre S3 sin servidores. Reconstruye la estrella (CTAS) y</text>
<text x="683" y="863" font-size="11.5" fill="#343a40">responde las preguntas de negocio; cobra solo por los datos que lee.</text>
<circle cx="665" cy="877" r="10" fill="#212529"/>
<text x="665" y="881" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<text x="683" y="881" font-size="13" font-weight="700" fill="#212529">Glue Data Catalog</text>
<text x="683" y="896" font-size="11.5" fill="#343a40">Guarda cómo son las tablas (columnas, tipos, particiones por mes) para</text>
<text x="683" y="910" font-size="11.5" fill="#343a40">que Athena las entienda. Las crea el propio refresco.</text>
<circle cx="665" cy="924" r="10" fill="#212529"/>
<text x="665" y="928" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
<text x="683" y="928" font-size="13" font-weight="700" fill="#212529">S3 star/</text>
<text x="683" y="943" font-size="11.5" fill="#343a40">El modelo estrella en Parquet: dim_date, dim_route (SCD tipo 2),</text>
<text x="683" y="957" font-size="11.5" fill="#343a40">dim_fare_class, fact_search y fact_booking_event.</text>
</svg>
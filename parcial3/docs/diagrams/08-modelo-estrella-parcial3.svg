<text x="34" y="712" font-size="11.5" fill="#343a40">PK = clave de la dimensión · FK = clave foránea · PART = columna de partición (las tablas de hechos se particionan por mes) · + en gris = atributo agregado por el equipo (no lo exige el contrato).</text>
<text x="34" y="730" font-size="11.5" fill="#343a40">Medidas: fact_search.searches; fact_booking_event.bookings, cancellations y revenue_cents (la cancelación es una fila propia con ingreso negativo).</text>
<text x="34" y="748" font-size="11.5" fill="#343a40">dim_date y dim_route son conformadas: las comparten los dos hechos (Q6 y Q7). route_key apunta a la versión vigente en la fecha del evento (valid_from ≤ fecha &lt; valid_to).</text>
<text x="34" y="766" font-size="11.5" fill="#343a40">Miembros 'UNKNOWN' con clave 0 en dim_route y dim_fare_class: un evento con ruta o clase desconocida nunca queda huérfano (R6).</text>
